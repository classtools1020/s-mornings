<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {

body {

}
.date-line::before,

article h1 {

  font-size: 11px;

  to { opacity: 1; transform: translateY(0); }

.masthead {
  animation: fadeUp 0.6s ease-out;

  background: var(--gold);
  color: var(--bg);

    body: `
<p>三個月前我開始學德文。</p>
<p>不是因為要去德國。也不是因為工作需要。</p>
<p>是因為——我想讀《人及其象徵》的原文。</p>
<p>榮格自己沒寫完那本書，他過世前讓學生 von Franz 接手。我讀過三遍中文翻譯，每次都覺得——某些字，翻譯後失去了什麼。</p>
<p>不是被誤譯。是「翻譯本來就會失去那個東西」。</p>
<p>我想知道我失去了什麼。</p>

<hr>

<p>我以為三個月可以讀懂。</p>
<p>我想得太美。</p>
<p>三個月的德文程度，連菜單都看得很慢。Buchstabe（字母）、Wort（單字）、Satz（句子）。從這三個字開始，到能拼成一句完整的話——要花的時間，比我想的長很多。</p>
<p>我以前以為「我學語言快」。剛學英文的時候我也是這樣覺得。</p>
<p>後來我發現——那不是因為我快。是因為英文跟中文有大量「假性相似」，給我錯覺。</p>
<p>德文跟中文沒有「假性相似」。德文跟英文也只有表面像。動詞要變位（六種人稱）。名詞有性別（陽、陰、中三種）。每個句子的格（主、受、與、所有）都會改變字尾。</p>
<p>我每寫一句話，要查三次字典。</p>

<hr>

<p>我想說我幾乎要放棄。</p>
<p>三個月之間，有兩次。</p>
<p>第一次是第三週。我在地鐵上看德文兒童繪本，看了二十分鐘看不懂兩頁。我把書蓋上，差點哭出來。一個四十歲的女人，看不懂三歲小孩看的書。</p>
<p>第二次是上個月。我在一個德國論壇問一個句法問題，沒人理我。後來才發現我問的句子文法錯到母語者覺得「不知道從何回答起」。</p>
<p>兩次我都在心裡跟自己說：</p>
<blockquote>「妳幾歲了還在做這種事。」</blockquote>

<hr>

<p>但我沒放棄。</p>
<p>不是因為毅力。</p>
<p>是因為我突然發現——</p>
<p><strong>「不知道」這件事，是四十歲之後最稀有的東西。</strong></p>
<p>四十歲之後，我太多東西「知道」了。教學二十年，我知道每個單元怎麼上。寫 IEP 寫到自動化。看到一個孩子的行為，我心裡已經有三套對策。</p>
<p>「知道」是專業。但「知道」也是僵化。</p>
<p>那個能被打開的我，被「知道」蓋住了。</p>

<hr>

<p>學德文那三個月，我每天有 30 分鐘是「不知道」的。</p>
<p>不知道這個動詞要怎麼變。不知道這個句子哪裡錯。不知道這個字唸 schmecken 還是 stimmen。</p>
<p>那 30 分鐘，我不是「曾老師」、不是「特教資深」、不是「複判教師」。</p>
<p>我是一個四十歲的初學者，努力地、認真地、慢慢地，學一個十歲小孩兩個月可以學會的東西。</p>
<p>那 30 分鐘——我覺得自己又活過來了。</p>

<hr>

<p>如果妳問我學德文有什麼用——</p>
<p>我目前還是讀不懂《人及其象徵》原文。我可能永遠都讀不懂。</p>
<p>但這不是重點。</p>
<p>重點是：我幫自己保留了一個「可以當笨蛋」的時段。</p>
<p>那個時段裡，我不需要表現、不需要對誰負責、不需要證明什麼。</p>
<p>我只需要——慢。</p>
<p>慢慢拼出 ich heiße（我叫做）。<br>
慢慢看懂 das Wetter ist schön（天氣很好）。<br>
慢慢知道——</p>
<blockquote>會的東西讓我活下來。<br>不會的東西讓我活下去。</blockquote>

<hr>

<p>我四十歲了。</p>
<p>我希望我五十歲的時候，還在學新的東西。新的、笨的、慢的、看起來沒用的東西。</p>
<p>因為「會」太多東西的人，活著活著就會變成自己的化石。</p>
<p>我寧可當笨蛋。</p>
<p><strong>笨蛋會長大。<br>化石不會。</strong></p>
`
  },

    body: `
<p>那天是星期一。早上六點四十五分，手機叫了三聲。</p>
<p>不是鬧鐘。是工作群組。有人在問週四的會議要不要開。</p>
<p>我躺在床上看那個紅點數字往上跳。3、7、14、23。八個群組同時亮起來。沒人回我，因為我還沒醒。</p>

<hr>

<p>那些「我以為很急的訊息」，第二天看也不會死。<br>
那些「我以為要立刻回應的問題」，沒回也沒人怪我。<br>
那些「以為沒我會崩潰的事」，沒崩潰。</p>
<p>第三天我發現一件讓我背脊發涼的事——</p>
<blockquote>過去那些秒讀秒回的我，可能根本不是專業，是焦慮。</blockquote>

<hr>

<p>我以前以為「即時回應」是負責任的表現。</p>
<p>回完群組訊息，我會有一種「我有用」的滿足感。但那個滿足，跟學生對我笑、跟家長感謝我、跟孩子寫字進步——是不一樣的。</p>
<p>那是廉價的滿足。是我用「分散注意力」買來的「我還在運作」的證明。</p>
<p>我真正想要的——是專注。<br>
是能寫完一份 IEP 不被打斷。<br>
是能備一節課把素材整理乾淨。<br>
是下班回家可以好好吃一頓飯。</p>
<p>那些事，需要的是「不被找到」的時間。</p>

<hr>

<p>第七天，我做了另一件事——</p>
<p>把家人 LINE 也靜音了。但保留兩個例外：我女兒、我先生。</p>
<p>其他人——包括我母親、我姐姐、我表妹——都靜音。</p>
<p>不是不愛她們。是我發現，她們的「即時」並不是那麼即時。</p>
<p>我母親傳「今天颱風要來」的時候，新聞已經報了五小時。<br>
我姐姐傳「我跟同學吵架」的時候，事情已經過了三天。<br>
我表妹傳「妳記得我們那次去九份嗎」的時候——那是六年前的事。</p>
<p>她們的訊息不需要我立刻回。她們需要的是我「有空的時候真心回」。</p>
<p>我把「即時」這個詞還給天氣預報跟救護車。</p>

<hr>

<p>七天之後我開始寫東西。</p>
<p>奇怪——我沒比較忙。我在做的事還是一樣。</p>
<p>但我寫得出來了。</p>
<p>我之前寫不出來，不是因為沒時間。是因為腦袋永遠有八個未讀視窗。</p>

<p>住在會一直叫的房子裡的人，沒辦法做夢。也沒辦法寫東西。</p>

<hr>

<p>我不會再回到秒讀秒回的日子。</p>
<p>那個我的存在，是讓別人方便。不是讓我自己活。</p>
<p>如果妳問我代價是什麼——</p>
<p>代價是有兩次同事覺得我冷淡。一次有人說我「不合群」。</p>
<p>就這樣。</p>
<p>我換到的是：每天早上五點到六點半的安靜，七小時的深睡眠，以及——</p>
<p>我自己。</p>
<p><strong>值。</strong></p>
`
  },

  article.innerHTML = `
    <h1>${post.title}</h1>
    <h2>${post.subtitle}</h2>
    ${post.body}
  `;
  // 格式化日期顯示
  const [y, m, d] = post.date.split('-');
  document.getElementById('dateLine').textContent =
    `${y} 年 ${parseInt(m)} 月 ${parseInt(d)} 日　${post.weekday}`;
  document.getElementById('signTime').textContent = post.signTime;
}

function renderArchive() {
  const list = document.getElementById('archiveList');
  // 排除今天那篇
  const today = todayStr();
  const others = posts.filter(p => p.date !== today && p.date < today);
  if (others.length === 0) {
    list.innerHTML = '<li style="justify-content:center; color:var(--ink-faint); border:none;">明天起，這裡會慢慢長出來</li>';
    return;
  }
  list.innerHTML = others.map((p, i) => `
    <li>
      <span class="arc-date">${p.date}</span>
      <a href="javascript:void(0)" onclick="loadPost(${posts.indexOf(p)})">${p.title}</a>
    </li>
  `).join('');
}

function loadPost(idx) {
  renderPost(posts[idx]);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 找今日對應的文章；找不到就最新
function init() {
  const today = todayStr();
  let post = posts.find(p => p.date === today);
  if (!post) {
    // 找日期 <= today 的最新
    const past = posts.filter(p => p.date <= today).sort((a, b) => b.date.localeCompare(a.date));
    post = past[0] || posts[0];
  }
  renderPost(post);
  renderArchive();
}

init();
</script>

</body>
</html>
